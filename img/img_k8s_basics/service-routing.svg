<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" role="img" aria-label="Pod 通过 DNS 与 Service 访问后端 Pod 的完整路径">
  <defs>
    <style>
      .bg { fill: #fffdf9; }
      .card { fill: #ffffff; stroke: #ddd2c2; stroke-width: 1.2; }
      .card-hi { fill: #fdf3f5; stroke: #dcb0bc; stroke-width: 1.3; }
      .pod { fill: #fdf8ef; stroke: #e0d5c4; stroke-width: 1.2; }
      .name { font-family: ui-monospace,Consolas,monospace; font-size: 12.5px; font-weight: 600; fill: #3d3a37; }
      .desc { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 11px; fill: #6b655c; }
      .ip { font-family: ui-monospace,Consolas,monospace; font-size: 11px; fill: #b5637a; }
      .num { font-family: ui-monospace,Consolas,monospace; font-size: 11px; font-weight: 700; fill: #b5637a; }
      .flow { stroke: #b9ac9b; stroke-width: 1.4; fill: none; }
      .flow-dash { stroke: #c7b6a6; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .note { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 11.5px; fill: #6b655c; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9ac9b"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c7b6a6"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="470" rx="10"/>

  <!-- Sandbox Pod -->
  <rect class="card-hi" x="34" y="176" width="186" height="112" rx="8"/>
  <text class="name" x="50" y="200">Sandbox Pod</text>
  <text class="desc" x="50" y="220">执行 Python 代码，</text>
  <text class="desc" x="50" y="237">要连 db-service:5432</text>
  <text class="ip" x="50" y="264">10.244.1.10</text>

  <!-- CoreDNS -->
  <rect class="card" x="300" y="40" width="190" height="104" rx="8"/>
  <text class="name" x="316" y="64">CoreDNS</text>
  <text class="desc" x="316" y="84">把服务名解析成</text>
  <text class="desc" x="316" y="101">ClusterIP</text>
  <text class="ip" x="316" y="126">db-service → 10.96.0.100</text>

  <!-- Service -->
  <rect class="card-hi" x="286" y="196" width="212" height="112" rx="8"/>
  <text class="name" x="302" y="220">Database Service</text>
  <text class="desc" x="302" y="240">虚拟地址 + 转发规则</text>
  <text class="desc" x="302" y="257">本身不是进程</text>
  <text class="ip" x="302" y="284">10.96.0.100:5432</text>

  <!-- 后端 Pod -->
  <rect class="pod" x="596" y="146" width="176" height="86" rx="8"/>
  <text class="name" x="612" y="170">Database Pod A</text>
  <text class="ip" x="612" y="192">10.244.2.20:5432</text>
  <text class="desc" x="612" y="214">label: app=db</text>

  <rect class="pod" x="596" y="268" width="176" height="86" rx="8"/>
  <text class="name" x="612" y="292">Database Pod B</text>
  <text class="ip" x="612" y="314">10.244.2.21:5432</text>
  <text class="desc" x="612" y="336">label: app=db</text>

  <!-- ① 查询 -->
  <path class="flow" d="M120 176 V 106 H 296" marker-end="url(#a)"/>
  <text class="num" x="128" y="166">①</text>
  <text class="desc" x="134" y="92">查 db-service</text>

  <!-- ② 返回 -->
  <path class="flow-dash" d="M300 132 H 200 V 170" marker-end="url(#ad)"/>
  <text class="num" x="278" y="126">②</text>

  <!-- ③ 连接 Service -->
  <path class="flow" d="M220 232 H 286" marker-end="url(#a)"/>
  <text class="num" x="244" y="224">③</text>

  <!-- ④ 转发 -->
  <path class="flow" d="M498 236 C 545 236, 545 189, 596 189" marker-end="url(#a)"/>
  <path class="flow" d="M498 268 C 545 268, 545 311, 596 311" marker-end="url(#a)"/>
  <text class="num" x="518" y="222">④</text>
  <text class="desc" x="512" y="360">按 label 选择后端，DNAT 到某个 Pod IP</text>

  <text class="note" x="34" y="404">Service 提供的是一个稳定的虚拟地址：Pod 重建后 IP 会变，Service 名字和 ClusterIP 不变。</text>
  <text class="note" x="34" y="426">kube-proxy 用 iptables / IPVS 写规则完成 ④；用 Cilium 这类 eBPF 方案时，这一步由 CNI 直接接管。</text>
</svg>
