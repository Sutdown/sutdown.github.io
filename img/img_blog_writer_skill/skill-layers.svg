<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img">
<title>Skill 的三层渐进式披露</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="30" width="360" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="54" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">第一层 · SKILL.md 的 YAML 头</text>
<text x="60" y="76" font-family="sans-serif" font-size="12" fill="#534AB7">name + description，约 100 token</text>
<text x="430" y="60" font-family="sans-serif" font-size="13" fill="#5F5E5A">启动时就加载</text>
<text x="430" y="78" font-family="sans-serif" font-size="12" fill="#888780">只用来判断"该不该用它"</text>

<path d="M220 90 L220 116" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="116" width="360" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="140" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">第二层 · SKILL.md 正文</text>
<text x="60" y="162" font-family="sans-serif" font-size="12" fill="#0F6E56">六步流程 + 六条硬门禁</text>
<text x="430" y="146" font-family="sans-serif" font-size="13" fill="#5F5E5A">任务匹配时才读</text>
<text x="430" y="164" font-family="sans-serif" font-size="12" fill="#888780">真正的指令在这一层</text>

<path d="M220 176 L220 202" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="202" width="360" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="226" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">第三层 · references/ + scripts/</text>
<text x="60" y="248" font-family="sans-serif" font-size="12" fill="#854F0B">风格卡、落盘规范、建稿脚本</text>
<text x="430" y="232" font-family="sans-serif" font-size="13" fill="#5F5E5A">用到哪一章才读哪一章</text>
<text x="430" y="250" font-family="sans-serif" font-size="12" fill="#888780">脚本只把输出带回上下文</text>
</svg>
