<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-label="一个 Sandbox 对象展开成 Pod、Service 与 PVC，status 由控制器写回">
  <defs>
    <style>
      .bg { fill: #fffdf9; }
      .card { fill: #ffffff; stroke: #ddd2c2; stroke-width: 1.2; }
      .card-hi { fill: #fdf3f5; stroke: #dcb0bc; stroke-width: 1.3; }
      .card-dim { fill: #faf7f1; stroke: #e5dccd; stroke-width: 1.2; }
      .name { font-family: ui-monospace,Consolas,monospace; font-size: 12.5px; font-weight: 600; fill: #3d3a37; }
      .desc { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 10.5px; fill: #6b655c; }
      .lbl { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 10.5px; fill: #b5637a; }
      .flow { stroke: #b9ac9b; stroke-width: 1.4; fill: none; }
      .flow-dash { stroke: #c78d9b; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9ac9b"/>
    </marker>
    <marker id="o1h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c78d9b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="400" rx="10"/>

  <rect class="card-hi" x="60" y="96" width="220" height="96" rx="8"/>
  <text class="name" x="76" y="120">Sandbox</text>
  <text class="desc" x="76" y="142">用户声明的对象，</text>
  <text class="desc" x="76" y="160">不是 Pod 本身</text>
  <text class="desc" x="76" y="180">spec 里写期望配置</text>

  <path class="flow-dash" d="M170 192 V 228" marker-end="url(#o1h)"/>
  <text class="lbl" x="182" y="216">控制器写回</text>

  <rect class="card-dim" x="60" y="232" width="220" height="96" rx="8"/>
  <text class="name" x="76" y="256">status</text>
  <text class="desc" x="76" y="278">控制器看到的结果：</text>
  <text class="desc" x="76" y="296">是否就绪、绑定了</text>
  <text class="desc" x="76" y="314">哪个 Pod 与 Service</text>

  <path class="flow" d="M280 144 H 330 V 110 H 412" marker-end="url(#o1)"/>
  <path class="flow" d="M280 144 H 330 V 210 H 412" marker-end="url(#o1)"/>
  <path class="flow" d="M280 144 H 330 V 310 H 412" marker-end="url(#o1)"/>

  <rect class="card" x="416" y="74" width="440" height="72" rx="8"/>
  <text class="name" x="432" y="98">Pod</text>
  <text class="desc" x="432" y="120">名字就是 Sandbox 名，身份稳定，容器真正跑在这里</text>
  <text class="desc" x="432" y="137">挂起时删掉，恢复时新建，生命周期跟着会话走</text>

  <rect class="card" x="416" y="174" width="440" height="72" rx="8"/>
  <text class="name" x="432" y="198">Service</text>
  <text class="desc" x="432" y="220">给沙箱一个稳定的网络身份：Pod 重建换了 IP，名字仍然有效</text>
  <text class="desc" x="432" y="237">别的服务按名字就能找到它</text>

  <rect class="card" x="416" y="274" width="440" height="72" rx="8"/>
  <text class="name" x="432" y="298">PVC</text>
  <text class="desc" x="432" y="320">持久化工作目录，独立于 Pod 的生命周期</text>
  <text class="desc" x="432" y="337">挂起或重建之后，新 Pod 还挂在同一块卷上</text>

  <text class="desc" x="60" y="372">关联资源靠 OwnerReference 判归属，不能只看名字；spec 是用户写的，status 是控制器写的。</text>
</svg>
