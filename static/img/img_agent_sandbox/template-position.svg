<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-label="SandboxTemplate 作为配置蓝图被 WarmPool 引用，产出各自独立的沙箱实例">
  <defs>
    <style>
      .bg { fill: #fffdf9; }
      .zone { fill: #fdf8ef; stroke: #e6dccd; stroke-width: 1.2; }
      .card { fill: #ffffff; stroke: #ddd2c2; stroke-width: 1.2; }
      .card-hi { fill: #fdf3f5; stroke: #dcb0bc; stroke-width: 1.3; }
      .name { font-family: ui-monospace,Consolas,monospace; font-size: 12px; font-weight: 600; fill: #3d3a37; }
      .desc { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 10.5px; fill: #6b655c; }
      .lbl { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 10.5px; fill: #b5637a; }
      .flow { stroke: #b9ac9b; stroke-width: 1.4; fill: none; }
      .flow-hi { stroke: #c78d9b; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9ac9b"/>
    </marker>
    <marker id="t1h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c78d9b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="400" rx="10"/>

  <rect class="card-hi" x="60" y="44" width="260" height="104" rx="8"/>
  <text class="name" x="76" y="68">SandboxTemplate</text>
  <text class="desc" x="76" y="90">可复用的沙箱配置蓝图</text>
  <text class="desc" x="76" y="108">镜像、启动命令、资源、</text>
  <text class="desc" x="76" y="126">存储与 Service 配置</text>

  <path class="flow" d="M320 96 H 384" marker-end="url(#t1)"/>
  <text class="lbl" x="330" y="86">引用</text>

  <rect class="card" x="384" y="44" width="300" height="104" rx="8"/>
  <text class="name" x="400" y="68">SandboxWarmPool</text>
  <text class="desc" x="400" y="90">按模板提前准备一批实例，</text>
  <text class="desc" x="400" y="108">维持 spec.replicas 个就绪沙箱，</text>
  <text class="desc" x="400" y="126">等 Claim 来申请</text>

  <path class="flow" d="M534 148 V 192 H 190 V 228" marker-end="url(#t1)"/>
  <path class="flow" d="M534 148 V 228" marker-end="url(#t1)"/>
  <path class="flow" d="M534 148 V 192 H 770 V 228" marker-end="url(#t1)"/>

  <rect class="card" x="60" y="232" width="260" height="104" rx="8"/>
  <text class="name" x="76" y="256">Sandbox A</text>
  <text class="desc" x="76" y="278">自己的 Pod、自己的卷</text>
  <text class="desc" x="76" y="296">配置来自同一份模板，</text>
  <text class="desc" x="76" y="314">运行实例彼此独立</text>

  <rect class="card" x="350" y="232" width="260" height="104" rx="8"/>
  <text class="name" x="366" y="256">Sandbox B</text>
  <text class="desc" x="366" y="278">自己的 Pod、自己的卷</text>
  <text class="desc" x="366" y="296">是否共享持久化数据、</text>
  <text class="desc" x="366" y="314">网络，取决于具体配置</text>

  <rect class="card" x="640" y="232" width="260" height="104" rx="8"/>
  <text class="name" x="656" y="256">Sandbox C</text>
  <text class="desc" x="656" y="278">自己的 Pod、自己的卷</text>
  <text class="desc" x="656" y="296">模板改了也不会自动</text>
  <text class="desc" x="656" y="314">更新正在跑的实例</text>

  <text class="desc" x="60" y="372">配置复用不等于运行环境共享：三个实例可以用同一份模板，但各自拥有独立的运行实例。</text>
</svg>
