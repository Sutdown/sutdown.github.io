<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" role="img" aria-label="判断沙箱是否可用的资源检查流程">
  <defs>
    <style>
      .bg { fill: #fffdf9; }
      .card { fill: #ffffff; stroke: #ddd2c2; stroke-width: 1.2; }
      .card-hi { fill: #fdf3f5; stroke: #dcb0bc; stroke-width: 1.3; }
      .card-warn { fill: #fdfaf3; stroke: #e3d3b0; stroke-width: 1.2; }
      .name { font-family: ui-monospace,Consolas,monospace; font-size: 12px; font-weight: 600; fill: #3d3a37; }
      .desc { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 10.5px; fill: #6b655c; }
      .lbl { font-family: system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; font-size: 10.5px; fill: #b5637a; }
      .flow { stroke: #b9ac9b; stroke-width: 1.4; fill: none; }
      .flow-warn { stroke: #c9b07e; stroke-width: 1.3; fill: none; }
    </style>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9ac9b"/>
    </marker>
    <marker id="c1w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9b07e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="440" rx="10"/>

  <rect class="card" x="60" y="44" width="270" height="60" rx="8"/>
  <text class="name" x="76" y="68">Pod 存在吗</text>
  <text class="desc" x="76" y="88">先看 spec 要求的对象在不在</text>

  <path class="flow-warn" d="M330 74 H 656" marker-end="url(#c1w)"/>
  <text class="lbl" x="470" y="66">否</text>
  <rect class="card-warn" x="656" y="44" width="250" height="60" rx="8"/>
  <text class="desc" x="672" y="68">按 spec 创建；调度失败要看</text>
  <text class="desc" x="672" y="88">Scheduler、节点资源和调度配置</text>

  <path class="flow" d="M195 104 V 136" marker-end="url(#c1)"/>
  <text class="lbl" x="204" y="124">是</text>

  <rect class="card" x="60" y="136" width="270" height="60" rx="8"/>
  <text class="name" x="76" y="160">Pod 已 Ready 吗</text>
  <text class="desc" x="76" y="180">结合 phase、Ready 条件判断</text>

  <path class="flow-warn" d="M330 166 H 656" marker-end="url(#c1w)"/>
  <text class="lbl" x="470" y="158">否</text>
  <rect class="card-warn" x="656" y="136" width="250" height="60" rx="8"/>
  <text class="desc" x="672" y="160">查容器状态、Readiness Probe、</text>
  <text class="desc" x="672" y="180">依赖资源；进程退出由 Kubelet 重启</text>

  <path class="flow" d="M195 196 V 228" marker-end="url(#c1)"/>
  <text class="lbl" x="204" y="216">是</text>

  <rect class="card" x="60" y="228" width="270" height="60" rx="8"/>
  <text class="name" x="76" y="252">PVC / Service 满足吗</text>
  <text class="desc" x="76" y="272">配置要求的其他资源是否可用</text>

  <path class="flow-warn" d="M330 258 H 656" marker-end="url(#c1w)"/>
  <text class="lbl" x="470" y="250">否</text>
  <rect class="card-warn" x="656" y="228" width="250" height="60" rx="8"/>
  <text class="desc" x="672" y="252">按资源类型分别排查存储、</text>
  <text class="desc" x="672" y="272">配置及关联资源状态</text>

  <path class="flow" d="M195 288 V 320" marker-end="url(#c1)"/>
  <text class="lbl" x="204" y="308">是</text>

  <rect class="card-hi" x="60" y="320" width="846" height="60" rx="8"/>
  <text class="name" x="76" y="344">更新 Sandbox.status：conditions 与就绪情况</text>
  <text class="desc" x="76" y="364">就绪 = Pod 的 Ready 条件为真 + spec 要求的其他资源都存在且可用；「Pod 存在」本身不等于沙箱可用。</text>

  <text class="desc" x="60" y="416">关联资源要检查 OwnerReference 等归属信息，不能只按名字判断——集群里可能有同名对象属于别的沙箱。</text>
</svg>
