<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'LXGW WenKai','Kaiti SC',sans-serif">
  <rect width="860" height="400" fill="#fdf9f2"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#8a6270">卡片底色的三段折中</text>
  <text x="40" y="72" font-size="14" fill="#9b8b90">页面底是米白 #fdf9f2，卡片底色在「太跳」和「太糊」之间只有一个窄区间</text>

  <!-- 方案 1 -->
  <text x="40" y="118" font-size="15" font-weight="700" fill="#a34a4a">第一版 · 纯白 #ffffff</text>
  <rect x="40" y="132" width="240" height="120" rx="12" fill="#fdf9f2" stroke="#e3d5d9" stroke-width="1"/>
  <rect x="60" y="152" width="200" height="80" rx="10" fill="#ffffff" stroke="#e3d5d9" stroke-width="1"/>
  <circle cx="90" cy="192" r="18" fill="#ffffff" stroke="#e3d5d9" stroke-width="1"/>
  <rect x="120" y="176" width="70" height="8" rx="4" fill="#ded4d8"/>
  <rect x="120" y="192" width="110" height="7" rx="3.5" fill="#e8dde1"/>
  <rect x="120" y="207" width="90" height="7" rx="3.5" fill="#ece3e6"/>
  <text x="40" y="272" font-size="12" fill="#a34a4a">白得发空 —— 卡片像贴在页面上的补丁</text>

  <!-- 方案 2 -->
  <text x="310" y="118" font-size="15" font-weight="700" fill="#a3744a">第二版 · 全透明</text>
  <rect x="310" y="132" width="240" height="120" rx="12" fill="#fdf9f2" stroke="#e3d5d9" stroke-width="1"/>
  <rect x="330" y="152" width="200" height="80" rx="10" fill="#fdf9f2" stroke="#e0cdd2" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="360" cy="192" r="18" fill="#fdf9f2" stroke="#d8c8cd" stroke-width="1"/>
  <rect x="390" y="176" width="70" height="8" rx="4" fill="#ded4d8"/>
  <rect x="390" y="192" width="110" height="7" rx="3.5" fill="#e8dde1"/>
  <rect x="390" y="207" width="90" height="7" rx="3.5" fill="#ece3e6"/>
  <text x="310" y="272" font-size="12" fill="#a3744a">和页面糊成一片，favicon 失去承托</text>

  <!-- 方案 3 -->
  <text x="580" y="118" font-size="15" font-weight="700" fill="#6f8a5e">定稿 · 暖白 #fffdf9</text>
  <rect x="580" y="132" width="240" height="120" rx="12" fill="#fdf9f2" stroke="#e3d5d9" stroke-width="1"/>
  <rect x="600" y="152" width="200" height="80" rx="10" fill="#fffdf9" stroke="#d49ba8" stroke-width="1.2"/>
  <circle cx="630" cy="192" r="18" fill="#ffffff" stroke="#d49ba8" stroke-width="1"/>
  <rect x="660" y="176" width="70" height="8" rx="4" fill="#ded4d8"/>
  <rect x="660" y="192" width="110" height="7" rx="3.5" fill="#e8dde1"/>
  <rect x="660" y="207" width="90" height="7" rx="3.5" fill="#ece3e6"/>
  <text x="580" y="272" font-size="12" fill="#6f8a5e">只比页面亮一档 + 藕粉描边，卡片立起来了</text>

  <!-- 底部对比条 -->
  <line x1="40" y1="308" x2="820" y2="308" stroke="#e3d5d9" stroke-width="1"/>

  <text x="40" y="336" font-size="13" fill="#7d6a70">亮度梯度：</text>
  <rect x="130" y="324" width="70" height="16" rx="3" fill="#fdf9f2" stroke="#e3d5d9" stroke-width="0.8"/>
  <text x="205" y="337" font-size="11" fill="#9b8b90">页面 #fdf9f2</text>
  <rect x="290" y="324" width="70" height="16" rx="3" fill="#fffdf9" stroke="#d49ba8" stroke-width="0.8"/>
  <text x="365" y="337" font-size="11" fill="#9b8b90">卡片 #fffdf9</text>
  <rect x="455" y="324" width="70" height="16" rx="3" fill="#ffffff" stroke="#e3d5d9" stroke-width="0.8"/>
  <text x="530" y="337" font-size="11" fill="#9b8b90">纯白 #ffffff</text>

  <text x="40" y="372" font-size="13" fill="#a89aa0">三档之间只差 1~2 个色阶，但观感差别很大 —— 底色这事没有「随便挑一个」的余地</text>
</svg>
