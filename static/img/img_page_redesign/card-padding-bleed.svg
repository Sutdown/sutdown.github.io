<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="'LXGW WenKai','Kaiti SC',sans-serif">
  <rect width="860" height="520" fill="#fdf9f2"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#8a6270">--card-padding 出血机制</text>
  <text x="40" y="72" font-size="14" fill="#9b8b90">文章卡内的内容靠 padding 内缩；代码块用等量负 margin 反向顶出，形成通栏</text>

  <!-- 左：文章卡场景 -->
  <text x="40" y="116" font-size="16" font-weight="700" fill="#8a6270">场景 A · 直接铺在文章卡里（正常）</text>

  <rect x="40" y="132" width="360" height="270" rx="10" fill="#ffffff" stroke="#e3d5d9" stroke-width="1.2"/>

  <!-- padding 区标注 -->
  <rect x="70" y="162" width="300" height="210" fill="#fdf9f2" stroke="#d49ba8" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
  <text x="72" y="156" font-size="11" fill="#c09aa4">← card-padding →</text>

  <!-- 正文 -->
  <rect x="82" y="176" width="240" height="9" rx="4" fill="#e8dde1"/>
  <rect x="82" y="192" width="200" height="9" rx="4" fill="#e8dde1"/>

  <!-- 代码块（出血） -->
  <rect x="52" y="216" width="336" height="66" rx="6" fill="#f4eee9" stroke="#d49ba8" stroke-width="1.2"/>
  <text x="68" y="243" font-size="12" fill="#7d6a70" font-family="monospace">margin-left: calc(var(--card-padding) * -1)</text>
  <text x="68" y="263" font-size="12" fill="#7d6a70" font-family="monospace">width: calc(100% + var(--card-padding) * 2)</text>

  <rect x="82" y="298" width="220" height="9" rx="4" fill="#e8dde1"/>
  <rect x="82" y="314" width="180" height="9" rx="4" fill="#e8dde1"/>

  <text x="52" y="352" font-size="12" fill="#7d9b7a">代码块比正文宽 60px，贴着卡片内缘 —— 这是设计意图</text>

  <!-- 右：说明卡场景 -->
  <text x="460" y="116" font-size="16" font-weight="700" fill="#8a6270">场景 B · 收进有描边的说明卡（溢出）</text>

  <rect x="460" y="132" width="360" height="270" rx="10" fill="#fffdf9" stroke="#d49ba8" stroke-width="1.5"/>

  <rect x="490" y="162" width="300" height="210" fill="none" stroke="#e0cdd2" stroke-width="1" stroke-dasharray="4 3" rx="4"/>

  <rect x="502" y="176" width="240" height="9" rx="4" fill="#e8dde1"/>
  <rect x="502" y="192" width="200" height="9" rx="4" fill="#e8dde1"/>

  <!-- 溢出的代码块：超出说明卡 -->
  <rect x="466" y="216" width="348" height="66" rx="6" fill="#fbeef1" stroke="#c9605f" stroke-width="1.5"/>
  <text x="480" y="243" font-size="12" fill="#a34a4a" font-family="monospace">左右各外扩 30px</text>
  <text x="480" y="263" font-size="12" fill="#a34a4a" font-family="monospace">→ 顶穿卡片描边</text>

  <rect x="502" y="298" width="220" height="9" rx="4" fill="#e8dde1"/>
  <rect x="502" y="314" width="180" height="9" rx="4" fill="#e8dde1"/>

  <text x="466" y="352" font-size="12" fill="#c9605f">说明卡内边距只有 1.25rem，外扩 30px 就出界了</text>

  <!-- 底部结论 -->
  <line x1="40" y1="428" x2="820" y2="428" stroke="#e3d5d9" stroke-width="1"/>
  <text x="40" y="456" font-size="14" fill="#7d6a70">修法：在说明卡作用域内把负 margin 归零 —— margin-left/right: 0，width: auto</text>
  <text x="40" y="480" font-size="13" fill="#a89aa0" font-family="monospace">.links-note-body .highlight { margin-left: 0 !important; width: auto !important; }</text>
</svg>
