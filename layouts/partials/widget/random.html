{{- $context := .Context -}}
{{- $limit := default 5 .Params.limit -}}
{{- $pages := shuffle (where $context.Site.RegularPages "Section" "in" $context.Site.Params.mainSections) -}}
<section class="widget random-posts">
    <h2 class="widget-title section-title">随机文章</h2>
    <div class="random-post-list">
        <p class="loading-text">加载中...</p>
    </div>
</section>

<script>
(function () {
    var posts = [
        {{ range first 30 $pages }}
        { title: {{ .Title | jsonify | safeJS }}, url: {{ .RelPermalink | jsonify | safeJS }} },
        {{ end }}
    ];

    var container = document.querySelector('.random-post-list');
    if (!container || posts.length === 0) return;

    for (var i = posts.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = posts[i];
        posts[i] = posts[j];
        posts[j] = t;
    }

    var list = document.createElement('ul');
    list.className = 'random-list';

    var count = Math.min({{ $limit }}, posts.length);
    for (var k = 0; k < count; k++) {
        var item = document.createElement('li');
        item.className = 'random-item';

        var link = document.createElement('a');
        link.href = posts[k].url;
        link.textContent = posts[k].title;

        item.appendChild(link);
        list.appendChild(item);
    }

    container.innerHTML = '';
    container.appendChild(list);
})();
</script>
