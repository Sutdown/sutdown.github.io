<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.6.0/style.css" />
<style>
.article-title, .spring-banner-title, .widget-title, .pagination-title, .article-category a,
.site-name, .site-description,
.archives-year, .category-list, .widget.stats,
.article-subtitle, .article-time,
.timeline-title, .timeline-desc, .category-timeline,
.search-form label, .search-form input::placeholder,
.menu-bottom-section span {
  font-family: "LXGW WenKai", "Kaiti SC", "KaiTi", sans-serif;
}
#TableOfContents, .random-post-list {
  font-family: "Songti SC", "SimSun", "宋体", "STSong", "Noto Serif SC", serif;
}
{{ if eq .Section "post" }}
.article-content {
  font-family: "Songti SC", "SimSun", "宋体", "STSong", "Noto Serif SC", serif;
}
{{ else }}
.article-content {
  font-family: "LXGW WenKai", "Kaiti SC", "KaiTi", "STKaiti", sans-serif;
}
{{ end }}
</style>
